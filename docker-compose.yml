version: '3.8'

services:
  frontend:
    build:
      context: ./src/nexora_client
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./src/nexora_client:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3000
    networks:
      - app-network

  backend:
    build:
      context: ./src
      dockerfile: nexora_server/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./src/nexora_server:/app/nexora_server
      - ./src/nexora_ai:/app/nexora_ai
      - /app/nexora_server/node_modules
      - /app/nexora_ai/node_modules
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
